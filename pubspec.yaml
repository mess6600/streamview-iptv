name: tivimate_clone
description: A modern IPTV player app for mobile and TV platforms

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video Player
  video_player: ^2.8.2
  chewie: ^1.7.1

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Navigation & TV Support
  go_router: ^13.0.1
  flutter_tv: ^0.0.1

  # EPG & XML Parsing
  xml: ^6.5.0
  intl: ^0.19.0

  # Utilities
  url_launcher: ^6.2.3
  package_info_plus: ^5.0.1
  wakelock_plus: ^1.1.4
  screen_brightness: ^0.2.0+1
  volume_controller: ^2.0.3

  # TV Remote Control
  hardware_buttons: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
